# Test Configuration — uses H2 in-memory DB, no real OpenAI calls

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Dummy OpenAI key for tests (mocked)
spring.ai.openai.api-key=sk-test-dummy-key

# JWT
app.jwt.secret=test-secret-key-for-unit-tests-only-32chars
app.jwt.expiration=3600000

# File upload
app.upload.dir=/tmp/docqa-test-uploads

# CORS
app.cors.allowed-origins=http://localhost:3000
